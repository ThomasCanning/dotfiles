set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- Mouse / scrollback ---
set -g mouse on
set -g history-limit 100000
set -g mode-keys vi

# Gentler wheel scrolling in copy mode (tmux default is 5 lines)
bind-key -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 2 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down

# Grab the entire scrollback at once, no selecting required
bind P run-shell 'tmux capture-pane -pJS - -t "#{pane_id}" | pbcopy'

# Dump the scrollback into nvim, where you have real motions and visual mode
bind E run-shell 'tmux capture-pane -pJS - -t "#{pane_id}" > /tmp/tmux-scrollback.txt; tmux new-window -n scrollback "nvim +\$ /tmp/tmux-scrollback.txt"'

# --- Key Bindings ---
set -g prefix C-Space
unbind C-b
bind-key C-Space send-prefix

unbind '%'
bind 5 split-window -h -c "#{pane_current_path}"

unbind '"'
bind 6 split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf

# Pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Close panes and windows without confirmation
unbind x
bind x kill-pane
unbind &
bind & kill-window

# --- Status Bar Appearance ---
set-option -g status-position top

# Catppuccin Minimal Configuration
# Leaves ONLY the session name on the right. 
# (Change "session" to "" if you want it completely blank)
set -g @catppuccin_status_modules_right "session" 

# Clean window names
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"

# --- Plugins ---
# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank' # copy selections to the system clipboard

set -g @yank_selection_mouse 'clipboard' # mouse drag copies straight to the system clipboard
set -g @yank_action 'copy-pipe' # stay in copy mode after yanking instead of jumping to the bottom

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


